[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dependency-injector>=4.49.0",
    "fastapi==0.111.0",
    "loguru>=0.7.3",
    "matplotlib==3.10.9",
    "numba==0.65.1",
    "numpy>=1.23",
    "openpyxl==3.1.4",
    "pydantic==2.13.3",
    "pydantic-settings>=2.14.0",
    "pymongo==4.7.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "toml>=0.10.2",
]

[dependency-groups]
dev = ["pytest>=9.0.1", "pytest-cov>=7.0.0", "ruff>=0.14.7"]

[tool.ruff]
line-length = 100
target-version = "py312"
preview = true
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "C90",   # mccabe
    "I",     # isort
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "COM",   # flake8-commas
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "EM",    # flake8-errmsg
    "ICN",   # flake8-import-conventions
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "SIM",   # flake8-simplify
    "TCH",   # flake8-typechecking
    "PTH",   # flake8-use-pathlib
    "UP",    # pyupgrade
    "RUF",   # ruff-specific
    "TRY",   # tryceratops
    "FURB",  # refurb
]
ignore = ["COM812"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = ["--cov-report=term", "--cov=src"]
pythonpath = ["src", "."]
markers = ["unit: unit tests", "integration: integration tests"]

[tool.coverage.run]
omit = ["*/dependency_injector/*", "src/tests/*"]
